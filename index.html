<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 띠 × MBTI 운세</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#252638;background:#f7f5fb}*{box-sizing:border-box}body{margin:0;padding:24px 14px}.wrap{max-width:520px;margin:auto}.hero{text-align:center;padding:20px 0}h1{font-size:27px;margin:12px 0}p{line-height:1.7;color:#6b6678}.card{background:white;border-radius:22px;padding:24px;box-shadow:0 8px 30px #28204c10}label{display:block;font-weight:700;margin:14px 0 7px}select,button{width:100%;border-radius:12px;padding:14px;font-size:16px}select{background:#fff;border:1px solid #ddd7e9}button{border:0;background:#6652ba;color:white;font-weight:750;margin-top:20px;cursor:pointer}.result{margin-top:20px;padding:22px;background:#f5f1ff;border-radius:18px}.result h2{font-size:21px}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.score div{text-align:center;background:white;border-radius:12px;padding:12px 3px;font-size:12px}.score b{display:block;color:#6a4dba;margin-top:5px;font-size:14px}.muted{font-size:12px;text-align:center;margin-top:18px}#result{display:none}</style></head><body><main class="wrap"><header class="hero"><div style="font-size:44px">🔮</div><h1>오늘의 띠 × MBTI 운세</h1><p id="date"></p><p>내 띠와 MBTI를 고르면 오늘의 운세가 나타나요!</p></header><section class="card"><label for="zodiac">🐾 나의 띠</label><select id="zodiac"></select><label for="mbti">✨ 나의 MBTI</label><select id="mbti"></select><button id="check">오늘의 운세 확인하기</button><div id="result" class="result" aria-live="polite"><h2 id="heading"></h2><p id="message"></p><div class="score"><div>💰 재물운<b id="money"></b></div><div>❤️ 애정운<b id="love"></b></div><div>💼 일·학업운<b id="work"></b></div></div><p id="lucky"></p><button id="copy">운세 복사하기</button></div></section><p class="muted">재미로 보는 창작 운세입니다. 실제 미래를 예측하거나 MBTI와 띠의 과학적 연관성을 주장하지 않습니다.</p></main><script>
const animals=['🐭 쥐띠','🐮 소띠','🐯 호랑이띠','🐰 토끼띠','🐲 용띠','🐍 뱀띠','🐴 말띠','🐑 양띠','🐵 원숭이띠','🐔 닭띠','🐶 개띠','🐷 돼지띠'];
const types=['ISTJ','ISFJ','INFJ','INTJ','ISTP','ISFP','INFP','INTP','ESTP','ESFP','ENFP','ENTP','ESTJ','ESFJ','ENFJ','ENTJ'];
const themes=['새로운 기회를 살펴보는','꾸준한 노력이 빛나는','용기와 배려가 필요한','소중한 인연을 돌아보는','목표를 다시 세워보는','깊이 생각하고 선택하는','활력을 충전하는','작은 행복을 발견하는','아이디어를 실행하는','차근차근 정리하는','믿음을 쌓아가는','여유를 즐기는'];
const tips=['미뤄둔 일 하나를 마무리해 보세요.','고마운 사람에게 안부를 전해 보세요.','생각을 차분히 표현해 보세요.','큰 목표를 작은 단계로 나눠 보세요.','새로운 방법을 안전하게 시험해 보세요.','좋아하는 취미로 기분을 전환해 보세요.','마음을 짧게 기록해 보세요.','궁금했던 주제를 탐구해 보세요.','망설이던 일에 작은 첫걸음을 내디뎌 보세요.','즐거운 만남을 계획해 보세요.','떠오른 아이디어를 하나 실행해 보세요.','새로운 관점을 받아들여 보세요.','우선순위를 정해 보세요.','따뜻한 칭찬을 건네 보세요.','함께하는 사람의 장점을 찾아보세요.','목표를 분명하게 말해 보세요.'];
const endings=['서두르지 않는 선택이 만족감을 줄 수 있어요.','대화를 통해 뜻밖의 힌트를 얻을 수 있겠네요.','작은 실천이 하루의 분위기를 바꿔 줄 거예요.','계획을 점검하면 마음이 더 든든해질 수 있어요.','잠깐의 휴식이 좋은 아이디어로 이어질 수 있어요.'];
const colors=['파랑','초록','빨강','분홍','금색','보라','주황','하늘색','노랑','흰색','갈색','베이지'];
const $=id=>document.getElementById(id);animals.forEach((x,i)=>$('zodiac').add(new Option(x,i)));types.forEach((x,i)=>$('mbti').add(new Option(x,i)));$('mbti').value='10';
function localDate(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>parts.find(p=>p.type===k).value;return `${get('year')}-${get('month')}-${get('day')}`}
const today=localDate();$('date').textContent=today.replaceAll('-','.')+' · 오늘의 운세';
function hash(s){let h=2166136261;for(const c of s){h=Math.imul(h^c.charCodeAt(0),16777619)}return h>>>0}
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);let last='';
$('check').onclick=()=>{const a=+$('zodiac').value,t=+$('mbti').value,seed=hash(today+':'+a+':'+t);const money=3+seed%3,love=3+Math.floor(seed/7)%3,work=3+Math.floor(seed/19)%3;const msg=`오늘은 ${themes[a]} 하루예요. ${tips[t]} ${endings[Math.floor(seed/41)%endings.length]} ${money===5?'금전적으로는 계획적인 선택에 집중해 보세요.':'예산을 먼저 확인하면 도움이 됩니다.'} ${love===5?'가까운 사람과 따뜻한 대화를 나눠 보세요.':'서로의 마음을 존중하는 여유가 필요해요.'}`;$('heading').textContent=animals[a]+' · '+types[t];$('message').textContent=msg;$('money').textContent=stars(money);$('love').textContent=stars(love);$('work').textContent=stars(work);$('lucky').textContent='🍀 행운의 색: '+colors[a]+' · 오늘의 키워드: '+['도전','배려','집중','휴식','소통'][seed%5];$('result').style.display='block';last=`${today} ${animals[a]} ${types[t]} 오늘의 운세\n${msg}\n재물운 ${stars(money)} / 애정운 ${stars(love)} / 일·학업운 ${stars(work)}\n${$('lucky').textContent}\n※ 재미로 보는 창작 운세`;};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(last);$('copy').textContent='복사 완료!'}catch(e){$('copy').textContent='복사할 수 없는 환경입니다.'}};
</script></body></html>
